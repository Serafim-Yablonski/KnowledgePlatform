# Every service restarts after a crash or an OOM kill; `docker compose stop` still stops it.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-knowledge_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_platform}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

  # The cache, rate limiter and research token stream. The work owed lives in
  # Postgres, not here (ADR-027), so nothing is persisted.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    env_file: .env
    # Override host-oriented URLs from .env with Docker service names.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      REDIS_URL: redis://redis:6379/0
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  # The pipeline's workers claim owed documents from Postgres (ADR-027); one
  # service per phase, so a stuck or memory-hungry extraction can't starve embedding.
  # SIGTERM: running attempts get PIPELINE_SHUTDOWN_GRACE (20 s), then are cancelled
  # and their rows released, before this period's SIGKILL.
  worker-extract:
    build: .
    restart: unless-stopped
    command: python -m src.workers extract
    stop_grace_period: 30s
    # The PDF parse is the one memory use driven by untrusted input. Past this cap the
    # kernel kills the biggest process, normally a parse child: retried, and killed on
    # every attempt → extraction_too_large. Equal swap limit: killed, never swapped.
    # Measured (25 MB uploads): 183 MiB idle + 543 MiB per concurrent extraction at
    # worst, for PIPELINE_EXTRACT_CONCURRENCY slots (tests/unit/test_compose.py
    # checks the default and what .env sets). Raise it with the concurrency.
    mem_limit: ${PIPELINE_EXTRACT_MEM_LIMIT:-1536m}
    memswap_limit: ${PIPELINE_EXTRACT_MEM_LIMIT:-1536m}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    # An allow-list, no env_file: it parses untrusted files and gets no provider key,
    # nor any key added to .env later (S8-19). A bare name passes the value from .env
    # or the shell, and stays unset (the setting's default) when neither has it.
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      # Read by Settings' validators in every process, not by the worker itself.
      - SECRET_KEY
      - POSTGRES_PASSWORD
      - ENVIRONMENT
      - LOG_LEVEL
      - SERVICE_NAME
      - LOGFIRE_TOKEN
      - PIPELINE_MAX_ATTEMPTS
      - PIPELINE_POLL_INTERVAL
      - PIPELINE_SHUTDOWN_GRACE
      - PIPELINE_EXTRACT_CONCURRENCY
      - PIPELINE_EXTRACT_PARSE_TIMEOUT
      - PIPELINE_EXTRACT_TIMEOUT
      - PIPELINE_EXTRACT_LEASE

  # I/O-bound embedding (the embedding provider's API): the only worker with its key.
  worker-embed:
    build: .
    restart: unless-stopped
    command: python -m src.workers embed
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}

  # MCP server is mounted at /mcp inside the main `app` container (port 8000).
  # No separate service needed — it shares the same DB engine and Redis pool.
  # Connect MCP clients to: http://localhost:8000/mcp

volumes:
  postgres_data:
  uploads_data:
