services:
  postgres:
    image: pgvector/pgvector:pg18
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-knowledge_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_platform}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    env_file: .env
    # Override host-oriented URLs from .env with Docker service names.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  # CPU-bound extraction (PDF parsing). Scale independently from embed workers.
  # Set CELERY_EXTRACT_CONCURRENCY in .env for production (default: 2 for local dev).
  celery-worker-extract:
    build: .
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=info --queues extract
      --concurrency ${CELERY_EXTRACT_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

  # I/O-bound embedding (HTTP calls to embedding API). Higher concurrency than extract.
  # Set CELERY_EMBED_CONCURRENCY in .env for production (default: 2 for local dev).
  celery-worker-embed:
    build: .
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=info --queues embed
      --concurrency ${CELERY_EMBED_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-knowledge_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

  # MCP server is mounted at /mcp inside the main `app` container (port 8000).
  # No separate service needed — it shares the same DB engine and Redis pool.
  # Connect MCP clients to: http://localhost:8000/mcp

volumes:
  postgres_data:
  uploads_data:
