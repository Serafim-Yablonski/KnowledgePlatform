[alembic]
# Path to migration scripts directory.
script_location = alembic

# Template used when generating migration file names.
file_template = %%(rev)s_%%(slug)s

# Truncate the slug to this length.
truncate_slug_length = 40

# Set to "true" to enable timezone-aware datetimes in the revision files.
timezone = UTC

# sqlalchemy.url is overridden in alembic/env.py from the DATABASE_URL env var.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
