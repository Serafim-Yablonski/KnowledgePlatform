[project]
name = "knowledge-platform"
version = "0.1.0"
description = "AI-powered multi-tenant knowledge platform"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]==0.136.1",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic-settings==2.14.0",
    "pydantic-ai-slim[anthropic,google,logfire]==1.89.1",
    "langgraph==1.1.10",
    "psycopg[binary]==3.3.4",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "pypdf==6.10.2",
    "structlog==25.5.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-instrumentation-celery==0.61b0",
    "logfire==4.32.1",
    "httpx==0.28.1",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.27",
    "pgvector==0.4.2",
    "mcp==1.27.0",
    "tiktoken==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.14.2",
    "factory-boy==3.3.3",
    "mypy==1.20.2",
    "ruff==0.15.12",
    "types-passlib==1.7.7.20260211",
    "types-python-jose==3.5.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "billiard.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
