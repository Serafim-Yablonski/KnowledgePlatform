[project]
name = "knowledge-platform"
version = "0.1.0"
description = "AI-powered multi-tenant knowledge platform"
requires-python = "==3.14.*"
dependencies = [
    "fastapi[standard]==0.136.1",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic-settings==2.14.0",
    "pydantic-ai-slim[anthropic,google,logfire]==1.89.1",
    "langgraph==1.1.10",
    "psycopg[binary]==3.3.4",
    "celery[redis]==5.6.3",
    "redis==6.4.0",
    "pypdf==6.10.2",
    "structlog==25.5.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-instrumentation-fastapi==0.61b0",
    "opentelemetry-instrumentation-celery==0.61b0",
    "logfire==4.32.1",
    "httpx==0.28.1",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8",
    "python-multipart==0.0.27",
    "pgvector==0.4.2",
    "mcp==1.27.0",
    "tiktoken==0.12.0",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers[postgres]==4.14.2",
    "factory-boy==3.3.3",
    "mypy==1.20.2",
    "ruff==0.15.12",
    "fakeredis>=2.35.1",
    "import-linter==2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "billiard.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "T20"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/ai/eval/*" = ["T20"]  # CLI tools: stdout is their interface

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.importlinter]
root_package = "src"
include_external_packages = true
# Annotation-only imports create no runtime coupling.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# Everything else receives finished services.
name = "Only the composition root builds repositories"
type = "forbidden"
source_modules = [
    "src.ai",
    "src.api",
    "src.core",
    "src.domain",
    "src.main",
    "src.mcp_server",
    "src.models",
    "src.schemas",
    "src.services",
    "src.workers",
]
forbidden_modules = ["src.repositories"]
ignore_imports = [
    # Not debt: services depend on repository interfaces by design (dependency injection).
    "src.** -> src.repositories.protocols",
]
# Adapters reach repositories only through src.composition, which is the point.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Business logic is framework-free"
type = "forbidden"
source_modules = ["src.services", "src.repositories", "src.domain"]
forbidden_modules = ["fastapi", "starlette"]
