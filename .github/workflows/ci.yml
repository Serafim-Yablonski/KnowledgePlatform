  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker image
        run: docker build -t knowledge-platform:ci .

      - name: Verify image starts
        run: |
          docker run --rm -d \
            --name kp-ci-test \
            -e DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/knowledge_platform \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e SECRET_KEY=ci-test-secret-key \
            -e GOOGLE_API_KEY=dummy \
            -e ANTHROPIC_API_KEY=dummy \
            -p 8000:8000 \
            knowledge-platform:ci
          sleep 5
          docker logs kp-ci-test 2>&1 | tail -20 || true
          docker stop kp-ci-test || true
