name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job writes to the repository; artifacts don't need the token.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/

      - name: import-linter contracts
        run: uv run lint-imports

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: mypy --strict src/
        run: uv run mypy --strict src/

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run unit and smoke tests
        run: uv run pytest tests/unit tests/test_smoke.py -x --cov=src --cov-report=
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          GOOGLE_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Pull test database image
        run: docker pull pgvector/pgvector:pg18

      - name: Run integration tests
        run: uv run pytest tests/integration -x --cov=src --cov-report=
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          GOOGLE_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          TESTCONTAINERS_RYUK_DISABLED: "true"
          COVERAGE_FILE: .coverage.integration

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run API tests
        run: uv run pytest tests/api -x --cov=src --cov-report=
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          GOOGLE_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          COVERAGE_FILE: .coverage.api

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-api
          path: .coverage.api
          include-hidden-files: true
          if-no-files-found: error

  test-ai:
    name: AI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run AI tests
        run: uv run pytest tests/ai -x --cov=src --cov-report=
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
          GOOGLE_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          COVERAGE_FILE: .coverage.ai

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-ai
          path: .coverage.ai
          include-hidden-files: true
          if-no-files-found: error

  # The suite is split across jobs, so the gate (same threshold as `make test`)
  # can only be checked on the combined data.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-api, test-ai]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"
          enable-caching: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and check coverage
        run: |
          uv run coverage combine
          uv run coverage report --fail-under=85
          uv run coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: knowledge_platform
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d knowledge_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build Docker image
        run: docker build -t knowledge-platform:ci .

      # Startup connects to Postgres (checkpointer) and Redis, so a broken image or
      # config exits before /health answers. No Celery worker runs here, so /health
      # is 503 with workers "unavailable"; the database and Redis must be "ok".
      - name: Verify image starts and reaches Postgres and Redis
        run: |
          docker run -d --name kp-ci-test --network host \
            -e DATABASE_URL=postgresql+asyncpg://user:password@localhost:5432/knowledge_platform \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CELERY_BROKER_URL=redis://localhost:6379/0 \
            -e CELERY_RESULT_BACKEND=redis://localhost:6379/1 \
            -e SECRET_KEY=ci-test-secret-key \
            -e GOOGLE_API_KEY=dummy \
            -e ANTHROPIC_API_KEY=dummy \
            knowledge-platform:ci
          body=""
          for _ in $(seq 1 30); do
            body=$(curl -s --max-time 10 http://localhost:8000/health) && break
            sleep 1
          done
          docker logs kp-ci-test 2>&1 | tail -20
          echo "health: $body"
          echo "$body" | jq -e '.checks.database == "ok" and .checks.redis == "ok"'
